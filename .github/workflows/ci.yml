name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 宿主包（@deepseek-ai/dsh-tools 等）由 dsh 本体提供，不随插件分发；
      # 测试里若找不到真包会自动回落到 test/ 下的最小桩（见 test/resolve-host-stub.mjs）。
      # --legacy-peer-deps：npm 11 的 arborist 在某些 peer 组合上会崩
      # （"Cannot read properties of null (reading 'children')"）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Test
        run: npm test
