name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # --legacy-peer-deps：核心包在 peerDependencies 里（由宿主 dsh 提供），
      # 裸 npm install 会在 peer 解析上崩（"Cannot read properties of null (reading 'children')"）；
      # 测试实际 import 的那份由 devDependencies 提供。
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Test
        run: npm test
